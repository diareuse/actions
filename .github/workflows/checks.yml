name: Checks

on:
  workflow_call:
    secrets:
      AUTH_TOKEN:
        required: true

#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTH_TOKEN }}

      - uses: diareuse/actions/.github/actions/env@v1
      - uses: diareuse/actions/.github/actions/android@v1

      - shell: bash
        run: ./gradlew test --no-daemon

      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Tests
          path: "**/test-results/**/*.xml"
          reporter: java-junit
          fail-on-empty: false

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTH_TOKEN }}

      - uses: diareuse/actions/.github/actions/env@v1
      - uses: diareuse/actions/.github/actions/android@v1

      - shell: bash
        run: ./gradlew lint --no-daemon

  merge:
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    permissions:
      pull-requests: write
      issues: write
      repository-projects: write
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTH_TOKEN }}
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --rebase "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.AUTH_TOKEN}}
